<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Indicador de Planta — Gerco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --verde:#2F8F5B; --amarillo:#D6A419; --naranja:#C97324; --rojo:#C0392B;
    --steel:#0C2478; --steel-dark:#081A57; --brand-blue:#00A8F0; --ink:#1E2426; --ink-soft:#5B6668;
    --paper:#F5F7F7; --card:#FFFFFF; --line:#DCE1E2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo{height:30px;width:auto;display:block;}
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-blue);}
  .brand .title{font-weight:700;font-size:16px;line-height:1.1;}
  .linklike{background:none;border:none;color:var(--steel);font-family:inherit;font-size:13px;cursor:pointer;padding:6px 8px;border-radius:6px;}
  .linklike:hover{background:#EEF2F3;}
  .wrap{max-width:480px;margin:0 auto;padding:24px 18px 60px;}
  .admin-wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
  .month-label{text-align:center;color:var(--ink-soft);font-size:13px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  h1.headline{text-align:center;font-size:22px;margin:0 0 22px;font-weight:700;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .field-group{margin-bottom:14px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  input[type=text],input[type=number],input[type=password]{
    width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;
    font-family:'IBM Plex Mono',monospace;font-size:16px;background:#FBFCFC;color:var(--ink);
  }
  input:focus{outline:2px solid var(--steel);outline-offset:1px;}
  button.primary{width:100%;padding:13px;border:none;border-radius:9px;background:var(--steel);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
  button.primary:hover{background:var(--steel-dark);}
  button.secondary{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-family:inherit;font-weight:500;font-size:13px;cursor:pointer;color:var(--ink);}
  button.secondary:hover{border-color:var(--steel);}
  .err{color:var(--rojo);font-size:13px;margin-top:8px;display:none;}
  .worker-name{text-align:center;font-size:16px;font-weight:600;}
  .bar-track{width:100%;height:22px;background:#E7EAEA;border-radius:11px;overflow:hidden;margin-top:16px;}
  .bar-fill{height:100%;border-radius:11px;transition:width 1s ease;}
  .bar-readout{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .bar-score{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:600;}
  .tier-label{padding:6px 14px;border-radius:20px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
  .mini-row{margin-bottom:12px;}
  .mini-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .mini-head .nombre{color:var(--ink-soft);}
  .mini-head .pct{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .mini-track{width:100%;height:8px;background:#E7EAEA;border-radius:5px;overflow:hidden;}
  .mini-fill{height:100%;border-radius:5px;}
  .back-link{display:block;text-align:center;margin-top:16px;}
  .hist-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:22px 0 10px;font-weight:600;border-top:1px solid var(--line);padding-top:16px;}
  .hist-item{padding:10px 0;border-bottom:1px solid #EEF0F0;}
  .hist-item:last-child{border-bottom:none;}
  .hist-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:10px;}
  .hist-ind{font-weight:600;}
  .hist-meta{font-family:'IBM Plex Mono',monospace;color:var(--rojo);font-size:12px;white-space:nowrap;}
  .hist-date{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12px;white-space:nowrap;}
  .hist-nota{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .hist-empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:14px 0;}
  .cat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px;}
  .cat-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .cat-name{font-weight:600;font-size:14px;}
  .cat-pct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .cat-card .mini-track{height:9px;margin-bottom:10px;}
  .cat-card .hist-item{padding:8px 0;}
  .pin-screen{max-width:320px;margin:80px auto 0;text-align:center;}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;}
  .tab{padding:9px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--ink-soft);}
  .tab.active{background:var(--steel);color:#fff;border-color:var(--steel);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;}
  .row-flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .chip-check{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;background:#fff;}
  .chip-check.checked{border-color:var(--steel);background:#EEF2F3;}
  .chip-check input{width:auto;}
  .chip-check .pts{margin-left:auto;font-family:'IBM Plex Mono',monospace;color:var(--rojo);font-size:12px;}
  .section-title{font-weight:700;font-size:15px;margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:88vw;text-align:center;}
  .toast.show{opacity:1;}
  .small-note{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .qr-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;}
  #qrcode{display:inline-block;margin:10px auto;}
  .del-btn{background:none;border:none;color:var(--rojo);cursor:pointer;font-size:12px;font-family:inherit;}
  .react-btn{background:none;border:none;color:var(--steel);cursor:pointer;font-size:12px;font-family:inherit;}
  select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:14px;background:#FBFCFC;color:var(--ink);}
  .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:13px;}
  .toggle-link{font-size:12px;color:var(--steel);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;margin-top:10px;display:inline-block;}
  .num-small{width:70px;padding:6px;}
  #printArea{position:fixed;left:-9999px;top:0;}
  .print-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;border-bottom:2px solid var(--ink);padding-bottom:10px;}
  .print-table{width:100%;border-collapse:collapse;font-size:13px;}
  .print-table th,.print-table td{border:1px solid #999;padding:6px 8px;text-align:left;}
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{position:static;left:0;display:block;}
  }
</style>
</head>

let sb = null;

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function periodLabel(periodo){
  const [y,m] = periodo.split('-');
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return meses[parseInt(m,10)-1] + ' ' + y;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function tierOf(score){
  if(score===null) return {label:'Sin datos', color:'#8A9496', bg:'#EEF0F0'};
  if(score>=90) return {label:'Sobresaliente', color:'#2F8F5B', bg:'#E7F3EC'};
  if(score>=70) return {label:'En regla', color:'#D6A419', bg:'#FBF0D9'};
  if(score>=50) return {label:'Atención', color:'#C97324', bg:'#F7E5D5'};
  return {label:'Crítico', color:'#C0392B', bg:'#F6DEDB'};
}

/* ---------- SUPABASE ---------- */
async function fetchAll(){
  try{
    const [tRes, iRes, rRes, aRes, bRes, lRes] = await Promise.all([
      sb.from('trabajadores').select('*').order('nombre'),
      sb.from('indicadores').select('*').order('creado_en'),
      sb.from('registros').select('*'),
      sb.from('ajustes').select('*').eq('id',1).maybeSingle(),
      sb.from('bonificaciones').select('*'),
      sb.from('lideres').select('*').order('nombre')
    ]);
    if(tRes.error) throw tRes.error;
    if(iRes.error) throw iRes.error;
    if(rRes.error) throw rRes.error;
    if(bRes.error) throw bRes.error;
    if(lRes.error) throw lRes.error;
    DATA.trabajadores = tRes.data || [];
    DATA.indicadores = iRes.data || [];
    DATA.registros = rRes.data || [];
    DATA.adminPin = (aRes.data && aRes.data.admin_pin) || '2026';
    DATA.bonificaciones = bRes.data || [];
    DATA.lideres = lRes.data || [];
    return true;
  }catch(e){
    showToast('No se pudo conectar con Supabase: ' + (e.message||e));
    return false;
  }
}

/* ---------- CÁLCULO ---------- */
function scoresFromRegistros(registrosSubset){
  const activos = DATA.indicadores.filter(i=>i.activo!==false);
  const inactivosConDatos = DATA.indicadores.filter(i=>i.activo===false && registrosSubset.some(r=>r.indicador_id===i.id));
  const cats = [...activos, ...inactivosConDatos];
  return cats.map(ind=>{
    const regs = registrosSubset.filter(r=>r.indicador_id===ind.id);
    const puntos = regs.length * ind.puntos_por_falta;
    const score = Math.max(0, 100 - puntos);
    return {id:ind.id, nombre:ind.nombre, peso:Number(ind.peso)||0, score, veces:regs.length};
  });
}
function categoriesForPeriod(periodo){
  const activos = DATA.indicadores.filter(i=>i.activo!==false);
  const inactivosConDatos = DATA.indicadores.filter(i=>i.activo===false && DATA.registros.some(r=>r.indicador_id===i.id && r.periodo===periodo));
  return [...activos, ...inactivosConDatos];
}
function computeCategoryScores(codigo, periodo){
  const subset = DATA.registros.filter(r=>r.trabajador_codigo===codigo && r.periodo===periodo);
  return scoresFromRegistros(subset);
}
function computeCategoryScoresRange(codigo, fechaInicio, fechaFin){
  const subset = DATA.registros.filter(r=>r.trabajador_codigo===codigo && r.fecha>=fechaInicio && r.fecha<=fechaFin);
  return scoresFromRegistros(subset);
}
function computeWeighted(catScores){
  if(!catScores.length) return null;
  const sumPeso = catScores.reduce((a,c)=>a+c.peso,0);
  if(sumPeso<=0) return Math.round((catScores.reduce((a,c)=>a+c.score,0)/catScores.length)*10)/10;
  return Math.round((catScores.reduce((a,c)=>a+c.score*c.peso,0)/sumPeso)*10)/10;
}
function allPeriodos(){
  const set = new Set(DATA.registros.map(r=>r.periodo));
  set.add(todayStr().slice(0,7));
  return Array.from(set).sort().reverse();
}
function quincenaRange(id){
  const [y,m,q] = id.split('-');
  const year = parseInt(y,10), month = parseInt(m,10);
  if(q==='Q1') return { inicio: `${y}-${m}-01`, fin: `${y}-${m}-15` };
  const lastDay = new Date(year, month, 0).getDate();
  return { inicio: `${y}-${m}-16`, fin: `${y}-${m}-${String(lastDay).padStart(2,'0')}` };
}
function quincenaLabel(id){
  const [y,m,q] = id.split('-');
  const {inicio, fin} = quincenaRange(id);
  const mesNombre = periodLabel(`${y}-${m}`).split(' ')[0];
  return `${inicio.split('-')[2]}–${fin.split('-')[2]} ${mesNombre} ${y}`;
}
function currentQuincenaId(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0');
  return `${y}-${m}-${d.getDate()<=15?'Q1':'Q2'}`;
}
function allQuincenas(){
  const set = new Set();
  DATA.registros.forEach(r=>{
    const [y,m,d] = r.fecha.split('-');
    set.add(`${y}-${m}-${parseInt(d,10)<=15?'Q1':'Q2'}`);
  });
  set.add(currentQuincenaId());
  return Array.from(set).sort().reverse();
}
function historialDelPeriodo(codigo, periodo){
  return DATA.registros
    .filter(r=>r.trabajador_codigo===codigo && r.periodo===periodo)
    .map(r=>{
      const ind = DATA.indicadores.find(i=>i.id===r.indicador_id);
      return { id:r.indicador_id, fecha:r.fecha, indicador: ind?ind.nombre:'(indicador eliminado)', puntos: ind?ind.puntos_por_falta:0, nota:r.nota, registradoPor:r.registrado_por };
    })
    .sort((a,b)=> b.fecha.localeCompare(a.fecha));
}

function renderResumen(){
  const periodos = allPeriodos();
  if(!resumenPeriodo) resumenPeriodo = periodos[0];
  const opcionesPeriodo = periodos.map(p=>`<option value="${p}" ${p===resumenPeriodo?'selected':''}>${periodLabel(p)}</option>`).join('');
  const trabActivos = DATA.trabajadores.filter(t=>t.activo!==false);

  const porTrabajador = trabActivos.map(t=>{
    const cats = computeCategoryScores(t.codigo, resumenPeriodo);
    const overall = computeWeighted(cats);
    return {t, overall, cats};
  }).sort((a,b)=>(b.overall??0)-(a.overall??0));

  const promedioGeneral = porTrabajador.length
    ? Math.round((porTrabajador.reduce((a,r)=>a+(r.overall??0),0)/porTrabajador.length)*10)/10
    : null;
  const tierGeneral = tierOf(promedioGeneral);

  const cats = categoriesForPeriod(resumenPeriodo);
  const promedioPorCategoria = cats.map(ind=>{
    const valores = trabActivos.map(t=>{
      const c = computeCategoryScores(t.codigo, resumenPeriodo).find(x=>x.id===ind.id);
      return c ? c.score : 100;
    });
    const prom = valores.length ? Math.round((valores.reduce((a,v)=>a+v,0)/valores.length)*10)/10 : 100;
    return {nombre: ind.nombre, prom};
  });

  const filasTabla = porTrabajador.map(r=>{
    const tier = tierOf(r.overall);
    return `<tr>
      <td>${r.t.nombre}</td><td class="mono">${r.t.codigo}</td>
      <td style="width:120px;"><div class="mini-track"><div class="mini-fill" style="width:${r.overall??0}%;background:${tier.color};"></div></div></td>
      <td class="mono" style="font-weight:600;">${r.overall===null?'—':r.overall+'%'}</td>
      <td><span style="color:${tier.color};font-weight:600;">${tier.label}</span></td>
    </tr>`;
  }).join('');

  const detalleSel = resumenDetalleCodigo || (trabActivos[0] ? trabActivos[0].codigo : '');
  const detalleTrab = trabActivos.find(t=>t.codigo===detalleSel);
  const detalleCats = detalleTrab ? computeCategoryScores(detalleTrab.codigo, resumenPeriodo) : [];
  const detalleHistorial = detalleTrab ? historialDelPeriodo(detalleTrab.codigo, resumenPeriodo) : [];
  const opcionesDetalle = trabActivos.map(t=>`<option value="${t.codigo}" ${t.codigo===detalleSel?'selected':''}>${t.nombre}</option>`).join('');

  return `
  <div class="section-title">Resumen del periodo</div>
  <div class="card">
    <div class="field-group"><label>Periodo</label><select id="selPeriodo">${opcionesPeriodo}</select></div>

    <div class="mini-row">
      <div class="mini-head"><span class="nombre">Promedio general de la planta</span><span class="pct" style="color:${tierGeneral.color};">${promedioGeneral===null?'—':promedioGeneral+'%'}</span></div>
      <div class="mini-track" style="height:14px;"><div class="mini-fill" style="width:${promedioGeneral??0}%;background:${tierGeneral.color};"></div></div>
    </div>

    <div class="section-title" style="margin-top:20px;">Promedio por categoría (toda la planta)</div>
    ${promedioPorCategoria.map(c=>{
      const t = tierOf(c.prom);
      return `<div class="mini-row">
        <div class="mini-head"><span class="nombre">${c.nombre}</span><span class="pct">${c.prom}%</span></div>
        <div class="mini-track"><div class="mini-fill" style="width:${c.prom}%;background:${t.color};"></div></div>
      </div>`;
    }).join('') || '<div class="small-note">Sin indicadores configurados.</div>'}

    <div class="section-title" style="margin-top:24px;">Por trabajador</div>
    <table>
      <thead><tr><th>Nombre</th><th>Código</th><th></th><th>Score</th><th>Nivel</th></tr></thead>
      <tbody>${filasTabla || '<tr><td colspan="5" class="small-note">Sin trabajadores activos.</td></tr>'}</tbody>
    </table>
    <button class="secondary" style="margin-top:14px;" id="btnCopiarResumen">Copiar resumen para WhatsApp</button>

    <div class="section-title" style="margin-top:26px;">Detalle por categoría de un trabajador</div>
    <select id="selDetalle">${opcionesDetalle}</select>
    <div style="margin-top:14px;">
      ${detalleCats.map(c=>{
        const t = tierOf(c.score);
        const items = detalleHistorial.filter(h=>h.id===c.id);
        return `<div class="mini-row">
          <div class="mini-head"><span class="nombre">${c.nombre}${c.veces?` (${c.veces}×)`:''}</span><span class="pct">${c.score}%</span></div>
          <div class="mini-track"><div class="mini-fill" style="width:${c.score}%;background:${t.color};"></div></div>
          ${items.map(h=>`<div class="small-note" style="margin-top:4px;">${h.fecha} — ${h.nota||'sin observación'} <span style="color:var(--ink-soft);">(registró: ${h.registradoPor||'—'})</span></div>`).join('')}
        </div>`;
      }).join('') || '<div class="small-note">Sin trabajadores o indicadores aún.</div>'}
    </div>
  </div>`;
}

function formatCOP(v){
  return new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0}).format(v||0);
}
function renderBonificacion(){
  const quincenas = allQuincenas();
  if(!bonoQuincena) bonoQuincena = quincenas[0];
  const opcionesPeriodo = quincenas.map(q=>`<option value="${q}" ${q===bonoQuincena?'selected':''}>${quincenaLabel(q)}</option>`).join('');
  const {inicio, fin} = quincenaRange(bonoQuincena);
  const trabActivos = DATA.trabajadores.filter(t=>t.activo!==false);
  const filas = trabActivos.map(t=>{
    const overall = computeWeighted(computeCategoryScoresRange(t.codigo, inicio, fin));
    const pct = overall===null ? 0 : overall;
    const montoBase = Number(t.monto_base)||0;
    const valor = montoBase * (pct/100);
    return {codigo:t.codigo, nombre:t.nombre, pct, montoBase, valor};
  }).sort((a,b)=> b.pct-a.pct);
  const totalBono = filas.reduce((a,f)=>a+f.valor,0);

  return `
  <div class="section-title">Bonificación</div>
  <div class="card">
    <div class="field-group"><label>Quincena</label><select id="selPeriodoBono">${opcionesPeriodo}</select></div>
    <table>
      <thead><tr><th>Código</th><th>Nombre</th><th>%</th><th>Monto base</th><th>Bonificación</th></tr></thead>
      <tbody>${filas.map(f=>`<tr><td class="mono">${f.codigo}</td><td>${f.nombre}</td><td class="mono">${f.pct}%</td><td class="mono">${formatCOP(f.montoBase)}</td><td class="mono">${formatCOP(f.valor)}</td></tr>`).join('') || '<tr><td colspan="5" class="small-note">Sin trabajadores activos.</td></tr>'}</tbody>
      ${filas.length ? `<tfoot><tr><td colspan="4" style="font-weight:600;">Total a pagar</td><td class="mono" style="font-weight:600;">${formatCOP(totalBono)}</td></tr></tfoot>` : ''}
    </table>
    <button class="secondary" style="margin-top:14px;" id="btnGenerarPdfBono">Generar PDF / Imprimir</button>
    <div class="small-note">El monto base de cada quien se edita en la pestaña Trabajadores. El valor pagado es proporcional a su % de cumplimiento ponderado de esta quincena.</div>
  </div>`;
}

/* ---------- HANDLERS ---------- */
function attachHandlers(){
  document.getElementById('btnToggleAdmin').onclick = ()=>{
    if(view==='trabajador'){ view = currentSession ? 'admin' : 'pinGate'; }
    else { view = 'trabajador'; workerResult = null; currentSession = null; }
    render();
  };

  if(view==='trabajador'){
    if(!workerResult){
      const btn = document.getElementById('btnConsultar');
      const inp = document.getElementById('inpCodigo');
      const inpClave = document.getElementById('inpClave');
      const doConsult = ()=>{
        const codigo = inp.value.trim();
        const clave = inpClave.value.trim();
        const trabajador = DATA.trabajadores.find(t=>t.codigo===codigo && t.activo!==false);
        if(!trabajador || (trabajador.clave||'')!==clave){ document.getElementById('errCodigo').style.display='block'; return; }
        workerResult = {codigo};
        render();
      };
      btn.onclick = doConsult;
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doConsult(); });
      inpClave.addEventListener('keydown', e=>{ if(e.key==='Enter') doConsult(); });
    } else {
      document.getElementById('btnVolver').onclick = ()=>{ workerResult=null; render(); };
      requestAnimationFrame(()=>{
        const fill = document.querySelector('.bar-fill');
        if(fill){ const target = fill.getAttribute('data-target-width'); requestAnimationFrame(()=>{ fill.style.width = target+'%'; }); }
      });
    }
  }

  if(view==='pinGate'){
    const btn = document.getElementById('btnEntrarPin');
    const inp = document.getElementById('inpPin');
    const doEnter = ()=>{
      const pin = inp.value.trim();
      if(pin === DATA.adminPin){
        currentSession = {tipo:'admin', nombre:'Administrador'};
        view='admin'; adminTab='registrar'; render();
        return;
      }
      const lider = DATA.lideres.find(l=>l.activo!==false && l.pin===pin);
      if(lider){
        currentSession = {tipo:'lider', nombre:lider.nombre, id:lider.id};
        view='admin'; adminTab='registrar'; render();
        return;
      }
      document.getElementById('errPin').style.display='block';
    };
    btn.onclick = doEnter;
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doEnter(); });
  }

  if(view==='admin'){
    document.querySelectorAll('.tab').forEach(tabEl=>{
      tabEl.onclick = ()=>{ adminTab = tabEl.dataset.tab; pendingChange = null; render(); };
    });

    if(adminTab==='registrar'){
      document.getElementById('inpFecha').onchange = (e)=>{ registrarState.fecha = e.target.value; };
      document.getElementById('selTrabajador').onchange = (e)=>{ registrarState.trabajadorCodigo = e.target.value; };
      document.getElementById('inpNota').oninput = (e)=>{ registrarState.nota = e.target.value; };
      document.querySelectorAll('[data-ind-cb]').forEach(cb=>{
        cb.onchange = ()=>{ registrarState.marcados[cb.dataset.indCb] = cb.checked; render(); };
      });
      document.getElementById('btnGuardarRegistro').onclick = async ()=>{
        if(!registrarState.trabajadorCodigo){ showToast('Selecciona un trabajador.'); return; }
        const ids = Object.keys(registrarState.marcados).filter(k=>registrarState.marcados[k]);
        if(ids.length===0){ showToast('Marca al menos un indicador.'); return; }
        const filas = ids.map(id=>({fecha: registrarState.fecha, trabajador_codigo: registrarState.trabajadorCodigo, indicador_id: id, nota: registrarState.nota, registrado_por: currentSession.nombre}));
        const {error} = await sb.from('registros').insert(filas);
        if(error){ showToast('No se pudo guardar: '+error.message); return; }
        showToast('Inspección guardada.');
        registrarState = { fecha: todayStr(), trabajadorCodigo:'', marcados:{}, nota:'' };
        await fetchAll(); render();
      };
    }

    if(adminTab==='trabajadores'){
      document.getElementById('btnAgregarTrab').onclick = async ()=>{
        const codigo = document.getElementById('inpNuevoCodigo').value.trim();
        const nombre = document.getElementById('inpNuevoNombre').value.trim();
        const clave = document.getElementById('inpNuevoClave').value.trim();
        const monto = parseFloat(document.getElementById('inpNuevoMonto').value) || 0;
        if(!codigo || !nombre){ showToast('Completa código y nombre.'); return; }
        if(!clave){ showToast('Ponle una clave para que solo él/ella pueda ver su score.'); return; }
        const {error} = await sb.from('trabajadores').insert({codigo, nombre, clave, monto_base: monto});
        if(error){ showToast('No se pudo agregar: '+error.message); return; }
        showToast('Trabajador agregado.');
        await fetchAll(); render();
      };
      document.querySelectorAll('[data-clave]').forEach(inp=>{
        inp.onchange = async ()=>{
          const {error} = await sb.from('trabajadores').update({clave: inp.value.trim()}).eq('codigo', inp.dataset.clave);
          if(error){ showToast('Error: '+error.message); return; }
          showToast('Clave actualizada.');
          await fetchAll();
        };
      });
      document.querySelectorAll('[data-monto]').forEach(inp=>{
        inp.onchange = async ()=>{
          const {error} = await sb.from('trabajadores').update({monto_base: parseFloat(inp.value)||0}).eq('codigo', inp.dataset.monto);
          if(error){ showToast('Error: '+error.message); return; }
          showToast('Monto base actualizado.');
          await fetchAll();
        };
      });
      document.querySelectorAll('[data-off-trab]').forEach(b=>{
        b.onclick = async ()=>{
          const codigo = b.dataset.offTrab;
          if(pendingChange && pendingChange.kind==='trab' && pendingChange.action==='off' && pendingChange.id===codigo){
            const {error} = await sb.from('trabajadores').update({activo:false}).eq('codigo', codigo);
            pendingChange = null;
            if(error){ showToast('Error: '+error.message); return; }
            showToast('Trabajador desactivado. Su historial se conserva.');
            await fetchAll(); render();
          } else { pendingChange = {kind:'trab', action:'off', id:codigo}; render(); }
        };
      });
      document.querySelectorAll('[data-on-trab]').forEach(b=>{
        b.onclick = async ()=>{
          const {error} = await sb.from('trabajadores').update({activo:true}).eq('codigo', b.dataset.onTrab);
          if(error){ showToast('Error: '+error.message); return; }
          await fetchAll(); render();
        };
      });
      const toggleBtn = document.getElementById('btnToggleInactivosTrab');
      if(toggleBtn) toggleBtn.onclick = ()=>{ mostrarInactivosTrab = !mostrarInactivosTrab; render(); };
    }

    if(adminTab==='indicadores'){
      document.querySelectorAll('[data-pts]').forEach(inp=>{
        inp.onchange = async ()=>{
          const {error} = await sb.from('indicadores').update({puntos_por_falta: parseInt(inp.value,10)||0}).eq('id', inp.dataset.pts);
          if(error){ showToast('Error: '+error.message); return; }
          showToast('Puntos actualizados.');
          await fetchAll();
        };
      });
      document.querySelectorAll('[data-peso]').forEach(inp=>{
        inp.onchange = async ()=>{
          const {error} = await sb.from('indicadores').update({peso: parseFloat(inp.value)||0}).eq('id', inp.dataset.peso);
          if(error){ showToast('Error: '+error.message); return; }
          showToast('Peso actualizado.');
          await fetchAll();
        };
      });
      document.querySelectorAll('[data-off-ind]').forEach(b=>{
        b.onclick = async ()=>{
          const id = b.dataset.offInd;
          if(pendingChange && pendingChange.kind==='ind' && pendingChange.action==='off' && pendingChange.id===id){
            const {error} = await sb.from('indicadores').update({activo:false}).eq('id', id);
            pendingChange = null;
            if(error){ showToast('Error: '+error.message); return; }
            showToast('Indicador desactivado.');
            await fetchAll(); render();
          } else { pendingChange = {kind:'ind', action:'off', id}; render(); }
        };
      });
      document.querySelectorAll('[data-on-ind]').forEach(b=>{
        b.onclick = async ()=>{
          const {error} = await sb.from('indicadores').update({activo:true}).eq('id', b.dataset.onInd);
          if(error){ showToast('Error: '+error.message); return; }
          await fetchAll(); render();
        };
      });
      document.getElementById('btnAgregarInd').onclick = async ()=>{
        const nombre = document.getElementById('inpNuevoIndNombre').value.trim();
        const pts = parseInt(document.getElementById('inpNuevoIndPts').value,10);
        const peso = parseFloat(document.getElementById('inpNuevoIndPeso').value);
        if(!nombre || isNaN(pts)){ showToast('Completa nombre y puntos.'); return; }
        const {error} = await sb.from('indicadores').insert({id: uid(), nombre, puntos_por_falta: pts, peso: isNaN(peso)?1:peso});
        if(error){ showToast('No se pudo agregar: '+error.message); return; }
        showToast('Indicador agregado.');
        await fetchAll(); render();
      };
      const toggleBtn = document.getElementById('btnToggleInactivosInd');
      if(toggleBtn) toggleBtn.onclick = ()=>{ mostrarInactivosInd = !mostrarInactivosInd; render(); };
      document.getElementById('btnCambiarPin').onclick = async ()=>{
        const nuevo = document.getElementById('inpNuevoPin').value.trim();
        if(!nuevo){ showToast('Escribe el nuevo PIN.'); return; }
        const {error} = await sb.from('ajustes').update({admin_pin:nuevo}).eq('id',1);
        if(error){ showToast('Error: '+error.message); return; }
        showToast('PIN actualizado.');
        await fetchAll();
      };
    }

    if(adminTab==='resumen'){
      document.getElementById('selPeriodo').onchange = (e)=>{ resumenPeriodo = e.target.value; render(); };
      const selDet = document.getElementById('selDetalle');
      if(selDet) selDet.onchange = (e)=>{ resumenDetalleCodigo = e.target.value; render(); };
      document.getElementById('btnCopiarResumen').onclick = ()=>{
        const trabActivos = DATA.trabajadores.filter(t=>t.activo!==false);
        const lineas = [`Indicador de planta — ${periodLabel(resumenPeriodo)}`];
        trabActivos.forEach(t=>{
          const overall = computeWeighted(computeCategoryScores(t.codigo, resumenPeriodo));
          const tier = tierOf(overall);
          lineas.push(`${t.nombre}: ${overall===null?'—':overall+'%'} (${tier.label})`);
        });
        const texto = lineas.join('\n');
        const fallbackCopy = ()=>{
          try{
            const ta = document.createElement('textarea');
            ta.value = texto; ta.style.position='fixed'; ta.style.opacity='0';
            document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
            showToast('Resumen copiado. Ya puedes pegarlo en WhatsApp.');
          }catch(e){ showToast('No se pudo copiar automáticamente.'); }
        };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(texto).then(()=>showToast('Resumen copiado. Ya puedes pegarlo en WhatsApp.')).catch(fallbackCopy);
        } else { fallbackCopy(); }
      };
    }

    if(adminTab==='bonificacion'){
      document.getElementById('selPeriodoBono').onchange = (e)=>{ bonoQuincena = e.target.value; render(); };
      document.getElementById('btnGenerarPdfBono').onclick = ()=>{
        const {inicio, fin} = quincenaRange(bonoQuincena);
        const trabActivos = DATA.trabajadores.filter(t=>t.activo!==false);
        const filas = trabActivos.map(t=>{
          const overall = computeWeighted(computeCategoryScoresRange(t.codigo, inicio, fin));
          const pct = overall===null ? 0 : overall;
          const montoBase = Number(t.monto_base)||0;
          return {codigo:t.codigo, nombre:t.nombre, pct, valor: montoBase*(pct/100)};
        }).sort((a,b)=> b.pct-a.pct);
        const total = filas.reduce((a,f)=>a+f.valor,0);
        const printArea = document.getElementById('printArea');
        printArea.innerHTML = `
          <div style="font-family:'Space Grotesk',sans-serif;color:#1E2426;padding:24px;">
            <div class="print-header">
              <div><div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5B6668;">Gerco · Planta</div>
                   <div style="font-size:18px;font-weight:700;">Bonificación de desempeño</div></div>
              <div style="text-align:right;font-size:13px;">${quincenaLabel(bonoQuincena)}</div>
            </div>
            <table class="print-table">
              <thead><tr><th>Código</th><th>Nombre</th><th>% Cumplimiento</th><th>Bonificación</th></tr></thead>
              <tbody>${filas.map(f=>`<tr><td>${f.codigo}</td><td>${f.nombre}</td><td>${f.pct}%</td><td>${formatCOP(f.valor)}</td></tr>`).join('')}</tbody>
              <tfoot><tr><td colspan="3" style="font-weight:700;">Total a pagar</td><td style="font-weight:700;">${formatCOP(total)}</td></tr></tfoot>
            </table>
          </div>`;
        window.print();
      };
    }

    if(adminTab==='lideres'){
      document.getElementById('btnAgregarLid').onclick = async ()=>{
        const nombre = document.getElementById('inpNuevoLidNombre').value.trim();
        const pin = document.getElementById('inpNuevoLidPin').value.trim();
        if(!nombre || !pin){ showToast('Completa nombre y PIN.'); return; }
        if(pin === DATA.adminPin){ showToast('Ese PIN ya lo usa el administrador, elige otro.'); return; }
        const {error} = await sb.from('lideres').insert({id: uid(), nombre, pin});
        if(error){ showToast('No se pudo agregar: '+error.message); return; }
        showToast('Líder agregado.');
        await fetchAll(); render();
      };
      document.querySelectorAll('[data-off-lid]').forEach(b=>{
        b.onclick = async ()=>{
          const id = b.dataset.offLid;
          if(pendingChange && pendingChange.kind==='lider' && pendingChange.action==='off' && pendingChange.id===id){
            const {error} = await sb.from('lideres').update({activo:false}).eq('id', id);
            pendingChange = null;
            if(error){ showToast('Error: '+error.message); return; }
            showToast('Líder desactivado.');
            await fetchAll(); render();
          } else { pendingChange = {kind:'lider', action:'off', id}; render(); }
        };
      });
      document.querySelectorAll('[data-on-lid]').forEach(b=>{
        b.onclick = async ()=>{
          const {error} = await sb.from('lideres').update({activo:true}).eq('id', b.dataset.onLid);
          if(error){ showToast('Error: '+error.message); return; }
          await fetchAll(); render();
        };
      });
      const toggleBtn = document.getElementById('btnToggleInactivosLid');
      if(toggleBtn) toggleBtn.onclick = ()=>{ mostrarInactivosLid = !mostrarInactivosLid; render(); };
    }

    if(adminTab==='qr'){
      document.getElementById('urlActual').textContent = window.location.href;
      const qrEl = document.getElementById('qrcode');
      qrEl.innerHTML = '';
      if(window.QRCode){
        new QRCode(qrEl, {text: window.location.href, width:200, height:200, colorDark:'#1E2426', colorLight:'#ffffff'});
      } else {
        qrEl.innerHTML = '<div class="small-note">No se pudo cargar el generador de QR.</div>';
      }
    }
  }
}

(async function init(){
  registrarState.fecha = todayStr();
  if(SUPABASE_URL.indexOf('PEGA_AQUI')!==-1 || SUPABASE_ANON_KEY.indexOf('PEGA_AQUI')!==-1){
    document.getElementById('app').innerHTML = `
      <div class="wrap"><div class="card">
        <h1 class="headline" style="font-size:17px;">Falta conectar Supabase</h1>
        <div class="small-note">Abre este archivo y, al inicio del &lt;script&gt;, reemplaza <b>SUPABASE_URL</b> y <b>SUPABASE_ANON_KEY</b> con los datos de tu proyecto (Project Settings → API). Luego recarga la página.</div>
      </div></div>`;
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ok = await fetchAll();
  if(!ok){
    document.getElementById('app').innerHTML = `<div class="wrap"><div class="card"><div class="small-note">No se pudo cargar la información. Revisa tu conexión o los datos del proyecto Supabase.</div></div></div>`;
    return;
  }
  render();
})();
</script>
</body>
</html>
