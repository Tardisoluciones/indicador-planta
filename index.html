<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Indicador de Planta</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Indicador">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --verde:#2F8F5B; --amarillo:#D6A419; --naranja:#C97324; --rojo:#C0392B;
    --steel:#0C2478; --steel-dark:#081A57; --brand-blue:#00A8F0; --ink:#1E2426; --ink-soft:#5B6668;
    --paper:#F5F7F7; --card:#FFFFFF; --line:#DCE1E2;
    --tint:#EEF2F3; --input-bg:#FBFCFC; --track:#E7EAEA; --card-shadow:none; --accent-bar:transparent;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .topbar{position:relative;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card);}
  .topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent-bar);pointer-events:none;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo{height:var(--logo-h,30px);width:auto;display:block;}
  @media (max-width:400px){ .brand-logo{height:var(--logo-h-movil,var(--logo-h,30px));} }
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-blue);white-space:nowrap;}
  .brand .title{font-weight:700;font-size:16px;line-height:1.1;}
  .linklike{background:none;border:none;color:var(--steel);font-family:inherit;font-size:13px;cursor:pointer;padding:6px 8px;border-radius:6px;}
  .linklike:hover{background:var(--tint);}
  .wrap{max-width:480px;margin:0 auto;padding:24px 18px 60px;}
  .admin-wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
  .month-label{text-align:center;color:var(--ink-soft);font-size:13px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  h1.headline{text-align:center;font-size:22px;margin:0 0 22px;font-weight:700;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--card-shadow);}
  .field-group{margin-bottom:14px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  input[type=text],input[type=number],input[type=password]{
    width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;
    font-family:'IBM Plex Mono',monospace;font-size:16px;background:var(--input-bg);color:var(--ink);
  }
  input:focus{outline:2px solid var(--steel);outline-offset:1px;}
  button.primary{width:100%;padding:13px;border:none;border-radius:9px;background:var(--steel);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
  button.primary:hover{background:var(--steel-dark);}
  button.primary:disabled,button.secondary:disabled{opacity:.45;cursor:not-allowed;}
  button.secondary{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-family:inherit;font-weight:500;font-size:13px;cursor:pointer;color:var(--ink);}
  button.secondary:hover{border-color:var(--steel);}
  .err{color:var(--rojo);font-size:13px;margin-top:8px;display:none;}
  .worker-name{text-align:center;font-size:16px;font-weight:600;}
  .bar-track{width:100%;height:22px;background:var(--track);border-radius:11px;overflow:hidden;margin-top:16px;}
  .bar-fill{height:100%;border-radius:11px;transition:width 1s ease;}
  .bar-readout{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .bar-score{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:600;}
  .tier-label{padding:6px 14px;border-radius:20px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
  .mini-row{margin-bottom:12px;}
  .mini-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .mini-head .nombre{color:var(--ink-soft);}
  .mini-head .pct{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .mini-track{width:100%;height:8px;background:var(--track);border-radius:5px;overflow:hidden;}
  .mini-fill{height:100%;border-radius:5px;}
  .back-link{display:block;text-align:center;margin-top:16px;}
  .hist-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:22px 0 10px;font-weight:600;border-top:1px solid var(--line);padding-top:16px;}
  .hist-item{padding:10px 0;border-bottom:1px solid #EEF0F0;}
  .hist-item:last-child{border-bottom:none;}
  .hist-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:10px;}
  .hist-ind{font-weight:600;}
  .hist-meta{font-family:'IBM Plex Mono',monospace;color:var(--rojo);font-size:12px;white-space:nowrap;}
  .hist-date{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12px;white-space:nowrap;}
  .hist-nota{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .hist-por{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .hist-por b{color:var(--steel);font-weight:600;}
  .hist-empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:14px 0;}
  .cat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px;box-shadow:var(--card-shadow);}
  .cat-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .cat-name{font-weight:600;font-size:14px;}
  .cat-pct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .cat-card .mini-track{height:9px;margin-bottom:10px;}
  .cat-card .hist-item{padding:8px 0;}
  .pin-screen{max-width:320px;margin:80px auto 0;text-align:center;}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;}
  .tab{padding:9px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--ink-soft);}
  .tab.active{background:var(--steel);color:#fff;border-color:var(--steel);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  .admin-wrap .card{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .admin-wrap .card table{min-width:100%;}
  .admin-wrap .card td.mono, .admin-wrap .card th{white-space:nowrap;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;}
  .row-flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .chip-check{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;background:#fff;}
  .chip-check.checked{border-color:var(--steel);background:var(--tint);}
  .chip-check input{width:auto;}
  .chip-check .pts{margin-left:auto;font-family:'IBM Plex Mono',monospace;color:var(--rojo);font-size:12px;}
  .section-title{font-weight:700;font-size:15px;margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:88vw;text-align:center;}
  .toast.show{opacity:1;}
  .small-note{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .qr-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;}
  #qrcode{display:inline-block;margin:10px auto;}
  .del-btn{background:none;border:none;color:var(--rojo);cursor:pointer;font-size:12px;font-family:inherit;}
  .react-btn{background:none;border:none;color:var(--steel);cursor:pointer;font-size:12px;font-family:inherit;}
  select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:14px;background:var(--input-bg);color:var(--ink);}
  .install-box{margin-top:16px;text-align:center;}
  .install-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--steel);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;box-shadow:var(--card-shadow);}
  .install-btn img{width:22px;height:22px;border-radius:6px;}
  .install-hint{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  /* --- pestañas del trabajador --- */
  .wtabs{display:flex;gap:4px;background:var(--track);padding:4px;border-radius:12px;margin:0 0 20px;}
  .wtab{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;border:none;background:none;font-family:inherit;}
  .wtab.active{background:var(--card);color:var(--steel);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  /* --- turnos --- */
  .week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
  .week-nav .wk-label{font-weight:600;font-size:14px;text-align:center;flex:1;}
  .week-nav .wk-sub{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .wk-btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--steel);}
  .seg{display:flex;gap:6px;margin-bottom:14px;}
  .seg button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .seg button.active{background:var(--steel);border-color:var(--steel);color:#fff;}
  .mi-turno{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
  .mi-turno .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-blue);font-weight:600;}
  .mi-turno .hrs{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;margin:4px 0 8px;}
  .dia-pills{display:flex;gap:5px;flex-wrap:wrap;}
  .dia-pill{min-width:34px;text-align:center;padding:5px 0;border-radius:8px;font-size:12px;font-weight:600;background:var(--track);color:var(--ink-soft);}
  .dia-pill.on{background:var(--steel);color:#fff;}
  .day-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--card-shadow);}
  .day-card.hoy{border-color:var(--steel);}
  .day-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .day-name{font-weight:700;font-size:14px;}
  .day-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .shift-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;}
  .shift-row:first-of-type{border-top:none;}
  .shift-row.yo{font-weight:700;color:var(--steel);}
  .shift-hrs{font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap;color:var(--ink-soft);}
  .shift-row.yo .shift-hrs{color:var(--steel);}
  .tag-hoy{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--steel);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle;}
  .turno-edit{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card);}
  .turno-edit.on{border-color:var(--steel);}
  .turno-edit .te-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
  .turno-edit .te-name{font-weight:600;font-size:14px;}
  .turno-edit .te-hrs{display:flex;align-items:center;gap:6px;}
  .turno-edit input[type=time]{padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--input-bg);color:var(--ink);width:auto;}
  .day-toggles{display:flex;gap:5px;flex-wrap:wrap;}
  .day-toggle{min-width:36px;padding:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .day-toggle.on{background:var(--steel);border-color:var(--steel);color:#fff;}
  .te-nota{margin-top:8px;}
  .te-nota input{padding:8px 10px;font-size:13px;font-family:'Space Grotesk',sans-serif;}
  .preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .preset-row button{padding:6px 10px;border-radius:999px;border:1px dashed var(--line);background:var(--card);font-family:inherit;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .sticky-save{position:sticky;bottom:12px;display:flex;gap:8px;margin-top:14px;}
  .sticky-save .primary{box-shadow:0 6px 18px rgba(0,0,0,.15);}
  .dirty-note{font-size:12px;color:var(--naranja);font-weight:600;margin-bottom:8px;}
  /* --- cartelera --- */
  .post{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:var(--card-shadow);}
  .post.fijado{border-color:var(--brand-blue);}
  .post-img{display:block;width:100%;max-height:460px;object-fit:contain;background:var(--track);}
  .post-img-ph{height:180px;background:var(--track);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px;}
  .post-body{padding:14px 16px 16px;}
  .post-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .pin-tag{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--brand-blue);border-radius:6px;padding:2px 6px;}
  .post-title{font-weight:700;font-size:16px;margin:0 0 6px;}
  .post-text{font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;}
  .post-link{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--steel);word-break:break-all;}
  .post-actions{display:flex;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);}
  textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:14px;background:var(--input-bg);color:var(--ink);min-height:110px;resize:vertical;}
  .img-preview{margin-top:10px;max-width:100%;max-height:240px;border-radius:10px;border:1px solid var(--line);display:block;}
  .file-btn{display:inline-block;padding:10px 14px;border:1px dashed var(--line);border-radius:9px;cursor:pointer;font-size:13px;color:var(--steel);font-weight:600;}
  .chk-inline{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0 14px;color:var(--ink);}
  .chk-inline input{width:auto;}
  .xl-bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;}
  .xl-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-family:inherit;font-size:13px;font-weight:600;color:var(--steel);cursor:pointer;}
  .xl-btn.verde{border-color:#2F8F5B;color:#2F8F5B;}
  .xl-panel{border:1px solid var(--steel);border-radius:12px;padding:14px;margin:0 0 16px;background:var(--card);}
  .xl-panel h4{margin:0 0 8px;font-size:14px;}
  .xl-res{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;}
  .xl-res span{padding:4px 10px;border-radius:999px;background:var(--track);font-weight:600;}
  .xl-res .ok{background:#E7F3EC;color:#2F8F5B;} .xl-res .er{background:#F6DEDB;color:#C0392B;} .xl-res .up{background:var(--tint);color:var(--steel);}
  .xl-table{font-size:12px;} .xl-table td{padding:6px 6px;}
  .xl-table tr.err td{background:#FDF1EF;}
  .xl-msg{color:#C0392B;font-size:11px;}
  .xl-warn{font-size:12px;color:var(--naranja);font-weight:600;margin:6px 0 10px;}
  .empty-state{text-align:center;padding:36px 16px;color:var(--ink-soft);font-size:13px;background:var(--card);border:1px dashed var(--line);border-radius:14px;}
  .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:13px;}
  .toggle-link{font-size:12px;color:var(--steel);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;margin-top:10px;display:inline-block;}
  .num-small{width:70px;padding:6px;}
  #printArea{position:fixed;left:-9999px;top:0;}
  .print-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;border-bottom:2px solid var(--ink);padding-bottom:10px;}
  .print-table{width:100%;border-collapse:collapse;font-size:13px;}
  .print-table th,.print-table td{border:1px solid #999;padding:6px 8px;text-align:left;}
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{position:static;left:0;display:block;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="" alt="" class="brand-logo" id="brandLogo">
    <div>
      <span class="eyebrow" id="brandEyebrow"></span><br>
      <span class="title">Indicador de desempeño</span>
    </div>
  </div>
  <button class="linklike" id="btnToggleAdmin">Panel administrador</button>
</div>

<div id="app"><div class="loading">Cargando…</div></div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script>
/* ======= LA CONFIGURACIÓN DE CADA EMPRESA ESTÁ EN config.js ======= */
/* Este archivo es idéntico para todas las empresas: no editar aquí.  */
if(typeof EMPRESA==='undefined'){ window.EMPRESA = null; }
const SUPABASE_URL = (window.EMPRESA && EMPRESA.supabaseUrl) || 'PEGA_AQUI';
const SUPABASE_ANON_KEY = (window.EMPRESA && EMPRESA.supabaseAnonKey) || 'PEGA_AQUI';
/* ==================================================================== */
/* ---------- APP INSTALABLE (PWA) ---------- */
let installPrompt = null;
function esStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function esIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); installPrompt = e; if(view==='trabajador' && !workerResult) render(); });
window.addEventListener('appinstalled', ()=>{ installPrompt = null; showToast('App instalada. Búscala en tu pantalla de inicio.'); render(); });
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
function renderInstalar(){
  if(esStandalone()) return '';
  const icono = `<img src="icons/icon-192.png" alt="">`;
  if(installPrompt) return `<div class="install-box"><button class="install-btn" id="btnInstalar">${icono}Instalar app en este celular</button></div>`;
  if(esIOS()) return `<div class="install-box"><div class="install-hint">Para tenerla como app en iPhone: toca <b>Compartir</b> y luego <b>"Agregar a inicio"</b>.</div></div>`;
  return '';
}

function aplicarMarca(){
  const e = window.EMPRESA; if(!e) return;
  document.title = e.tituloPestana || ('Indicador de Planta — ' + e.nombre);
  const logo = document.getElementById('brandLogo');
  logo.src = e.logo; logo.alt = e.nombre;
  const root = document.documentElement.style;
  if(e.logoAlto) root.setProperty('--logo-h', e.logoAlto + 'px');
  if(e.logoAltoMovil) root.setProperty('--logo-h-movil', e.logoAltoMovil + 'px');
  document.getElementById('brandEyebrow').textContent = e.etiqueta;
  const appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if(appTitle) appTitle.setAttribute('content', e.nombreApp || e.nombre);
  Object.entries(e.tema || {}).forEach(([k,v])=> root.setProperty('--'+k, v));
}

let sb = null;
let DATA = { trabajadores:[], indicadores:[], registros:[], adminPin:null, bonificaciones:[], lideres:[] };
let view = 'trabajador';

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function periodLabel(periodo){
  const [y,m] = periodo.split('-');
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return meses[parseInt(m,10)-1] + ' ' + y;
}
const DIAS_CORTO = ['L','M','X','J','V','S','D'];
const DIAS_LARGO = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseISO(d){ const [y,m,dd] = d.split('-').map(Number); return new Date(y, m-1, dd); }
function isoDe(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function sumarDias(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return isoDe(d); }
function lunesDe(iso){ const d = parseISO(iso); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); return isoDe(d); }
function fechaCorta(iso){ const d = parseISO(iso); return d.getDate()+' '+MESES_CORTO[d.getMonth()]; }
function semanaLabel(lunes){ return fechaCorta(lunes)+' – '+fechaCorta(sumarDias(lunes,6)); }
function fmtHora(h){
  if(!h) return '';
  const [H,M] = h.split(':').map(Number); const ap = H<12 ? 'a. m.' : 'p. m.'; const h12 = (H%12)||12;
  return h12+':'+String(M).padStart(2,'0')+' '+ap;
}
function horarioTxt(t){
  if(!t.hora_inicio && !t.hora_fin) return 'Horario por confirmar';
  return fmtHora(t.hora_inicio)+' – '+fmtHora(t.hora_fin);
}
function fechaPub(ts){ const d = new Date(ts); return d.getDate()+' '+MESES_CORTO[d.getMonth()]+' '+d.getFullYear(); }
function linkSeguro(u){ u = String(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u = 'https://'+u; return u; }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function tierOf(score){
  if(score===null) return {label:'Sin datos', color:'#8A9496', bg:'#EEF0F0'};
  if(score>=90) return {label:'Sobresaliente', color:'#2F8F5B', bg:'#E7F3EC'};
  if(score>=70) return {label:'En regla', color:'#D6A419', bg:'#FBF0D9'};
  if(score>=50) return {label:'Atención', color:'#C97324', bg:'#F7E5D5'};
  return {label:'Crítico', color:'#C0392B', bg:'#F6DEDB'};
}

/* Acceso seguro: la página NO lee tablas directamente. Todo pasa por funciones
   de Supabase que validan empresa + PIN (panel) o código + clave (trabajador). */
function empresaId(){ return window.EMPRESA.id; }
function limpiarDatos(){
  DATA.trabajadores = []; DATA.indicadores = []; DATA.registros = [];
  DATA.bonificaciones = []; DATA.lideres = []; DATA.adminPin = null;
  DATA.turnos = []; DATA.publicaciones = [];
  WORKER_CRED = null; workerTab = 'estado'; turnoSemanaTrab = 0;
  turnosDraft = null; turnosSemanaAdmin = null;
  nuevaPub = { titulo:'', texto:'', enlace:'', imagen:null, fijado:false };
  xlTrab = null; xlTurnos = null;
  Object.keys(IMG_CACHE).forEach(k=>delete IMG_CACHE[k]);
}
function cargarDatos(d){
  DATA.trabajadores = d.trabajadores || [];
  DATA.indicadores = d.indicadores || [];
  DATA.registros = d.registros || [];
  DATA.bonificaciones = d.bonificaciones || [];
  DATA.lideres = d.lideres || [];
  DATA.adminPin = d.admin_pin || null;
  DATA.turnos = d.turnos || [];
  DATA.publicaciones = d.publicaciones || [];
  if(d.lunes_actual) LUNES_ACTUAL = d.lunes_actual;
}
// Abre el panel con un PIN. Devuelve true si el PIN es válido para esta empresa.
async function abrirPanel(pin){
  const {data, error} = await sb.rpc('indicador_datos', {p_empresa: empresaId(), p_pin: pin});
  if(error){ showToast(error.message); return false; }
  if(!data) return false;
  SESION_PIN = pin; currentSession = data.sesion; cargarDatos(data);
  return true;
}
// Recarga los datos del panel con la sesión vigente
async function fetchAll(){
  if(!SESION_PIN) return false;
  const {data, error} = await sb.rpc('indicador_datos', {p_empresa: empresaId(), p_pin: SESION_PIN});
  if(error || !data){ showToast('No se pudo actualizar: ' + (error ? error.message : 'sesión no válida')); return false; }
  currentSession = data.sesion; cargarDatos(data);
  return true;
}
// Consulta del trabajador: solo recibe SUS registros
async function consultarTrabajador(codigo, clave){
  const {data, error} = await sb.rpc('indicador_trabajador', {p_empresa: empresaId(), p_codigo: codigo, p_clave: clave});
  if(error){ showToast(error.message); return false; }
  if(!data) return false;
  DATA.trabajadores = [data.trabajador];
  DATA.indicadores = data.indicadores || [];
  DATA.registros = data.registros || [];
  DATA.turnos = data.turnos || [];
  DATA.publicaciones = data.cartelera || [];
  LUNES_ACTUAL = data.lunes_actual || lunesDe(todayStr());
  WORKER_CRED = {codigo, clave};
  return true;
}
// Imagen de una publicación: se pide solo cuando se va a mostrar (privada)
async function cargarImagen(id){
  if(IMG_CACHE[id]) return IMG_CACHE[id];
  const args = {p_empresa: empresaId(), p_id: id,
    p_codigo: WORKER_CRED ? WORKER_CRED.codigo : null, p_clave: WORKER_CRED ? WORKER_CRED.clave : null,
    p_pin: WORKER_CRED ? null : SESION_PIN};
  const {data, error} = await sb.rpc('indicador_imagen', args);
  if(error || !data) return null;
  IMG_CACHE[id] = data; return data;
}
function hidratarImagenes(){
  document.querySelectorAll('[data-img-id]').forEach(async el=>{
    const id = el.dataset.imgId; const src = await cargarImagen(id);
    if(!src){ el.textContent = 'No se pudo cargar la imagen'; return; }
    const img = document.createElement('img'); img.className = 'post-img'; img.alt = ''; img.src = src;
    img.onclick = ()=>{ const w = window.open(); if(w){ w.document.write('<img src="'+src+'" style="max-width:100%">'); } };
    el.replaceWith(img);
  });
}
// Escrituras: misma forma que antes (db.from(tabla).insert / .update().eq()),
// pero se ejecutan en el servidor, que valida el PIN y la empresa.
async function mutar(tabla, op, valores, filtro){
  const {data, error} = await sb.rpc('indicador_mutar', {
    p_empresa: empresaId(), p_pin: SESION_PIN, p_tabla: tabla, p_op: op, p_valores: valores, p_filtro: filtro
  });
  return {data, error};
}
const db = {
  from(tabla){
    return {
      insert(valores){ return mutar(tabla, 'insert', valores, null); },
      update(valores){ return { eq(campo, valor){ return mutar(tabla, 'update', valores, {[campo]: valor}); } }; }
    };
  }
};

/* ---------- CÁLCULO ---------- */
function scoresFromRegistros(registrosSubset){
  const activos = DATA.indicadores.filter(i=>i.activo!==false);
  const inactivosConDatos = DATA.indicadores.filter(i=>i.activo===false && registrosSubset.some(r=>r.indicador_id===i.id));
  const cats = [...activos, ...inactivosConDatos];
  return cats.map(ind=>{
    const regs = registrosSubset.filter(r=>r.indicador_id===ind.id);
    const puntos = regs.length * ind.puntos_por_falta;
    const score = Math.max(0, 100 - puntos);
    return {id:ind.id, nombre:ind.nombre, peso:Number(ind.peso)||0, score, veces:regs.length};
  });
}
function categoriesForPeriod(periodo){
  const activos = DATA.indicadores.filter(i=>i.activo!==false);
  const inactivosConDatos = DATA.indicadores.filter(i=>i.activo===false && DATA.registros.some(r=>r.indicador_id===i.id && r.periodo===periodo));
  return [...activos, ...inactivosConDatos];
}
function computeCategoryScores(codigo, periodo){
  const subset = DATA.registros.filter(r=>r.trabajador_codigo===codigo && r.periodo===periodo);
  return scoresFromRegistros(subset);
}
function computeCategoryScoresRange(codigo, fechaInicio, fechaFin){
  const subset = DATA.registros.filter(r=>r.trabajador_codigo===codigo && r.fecha>=fechaInicio && r.fecha<=fechaFin);
  return scoresFromRegistros(subset);
}
function computeWeighted(catScores){
  if(!catScores.length) return null;
  const sumPeso = catScores.reduce((a,c)=>a+c.peso,0);
  if(sumPeso<=0) return Math.round((catScores.reduce((a,c)=>a+c.score,0)/catScores.length)*10)/10;
  return Math.round((catScores.reduce((a,c)=>a+c.score*c.peso,0)/sumPeso)*10)/10;
}
function allPeriodos(){
  const set = new Set(DATA.registros.map(r=>r.periodo));
  set.add(todayStr().slice(0,7));
  return Array.from(set).sort().reverse();
}
function quincenaRange(id){
  const [y,m,q] = id.split('-');
  const year = parseInt(y,10), month = parseInt(m,10);
  if(q==='Q1') return { inicio: `${y}-${m}-01`, fin: `${y}-${m}-15` };
  const lastDay = new Date(year, month, 0).getDate();
  return { inicio: `${y}-${m}-16`, fin: `${y}-${m}-${String(lastDay).padStart(2,'0')}` };
}
function quincenaLabel(id){
  const [y,m,q] = id.split('-');
  const {inicio, fin} = quincenaRange(id);
  const mesNombre = periodLabel(`${y}-${m}`).split(' ')[0];
  return `${inicio.split('-')[2]}–${fin.split('-')[2]} ${mesNombre} ${y}`;
}
function currentQuincenaId(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0');
  return `${y}-${m}-${d.getDate()<=15?'Q1':'Q2'}`;
}
function allQuincenas(){
  const set = new Set();
  DATA.registros.forEach(r=>{
    const [y,m,d] = r.fecha.split('-');
    set.add(`${y}-${m}-${parseInt(d,10)<=15?'Q1':'Q2'}`);
  });
  set.add(currentQuincenaId());
  return Array.from(set).sort().reverse();
}
function historialDelPeriodo(codigo, periodo){
  return DATA.registros
    .filter(r=>r.trabajador_codigo===codigo && r.periodo===periodo)
    .map(r=>{
      const ind = DATA.indicadores.find(i=>i.id===r.indicador_id);
      return { id:r.indicador_id, fecha:r.fecha, indicador: ind?ind.nombre:'(indicador eliminado)', puntos: ind?ind.puntos_por_falta:0, nota:r.nota, registradoPor:r.registrado_por };
    })
    .sort((a,b)=> b.fecha.localeCompare(a.fecha));
}

function renderTrabajador(){
  if(!workerResult){
    return `

      <div class="card">

  if(workerTab==='cartelera') return renderWorkerShell(renderCarteleraTrab());
  const {codigo} = workerResult;
  const trabajador = DATA.trabajadores.find(t=>t.codigo===codigo);
  const periodo = todayStr().slice(0,7);

    return `
    <div class="cat-card">
      <div class="cat-head"><span class="cat-name">${c.nombre}</span><span class="cat-pct" style="color:${t.color};">${c.score}%</span></div>

          ${h.nota ? `<div class="hist-nota">${esc(h.nota)}</div>` : ''}

    <h1 class="headline">Tu estado actual</h1>
    <div class="card">
      <div class="worker-name">${trabajador ? trabajador.nombre : ''}</div>
      <div class="bar-track"><div class="bar-fill" data-target-width="${overall===null?0:overall}" style="width:0%; background:${tier.color};"></div></div>
      <div class="bar-readout">
        <span class="bar-score">${overall===null?'—':overall+'%'}</span>
        <span class="tier-label" style="background:${tier.bg}; color:${tier.color};">${tier.label}</span>
      </div>
    </div>
    <div class="section-title" style="margin-top:22px;">Por categoría</div>
    ${catsHtml || '<div class="hist-empty">Sin categorías configuradas todavía.</div>'}
    <a class="back-link linklike" id="btnVolver" style="cursor:pointer;">← Salir</a>
  </div>`;
}

/* ---------- TURNOS (trabajador) ---------- */
function renderTurnosTrab(){
  const lunes = sumarDias(LUNES_ACTUAL, 7*turnoSemanaTrab);
  const turnos = DATA.turnos.filter(t=>t.semana===lunes);
  const yo = workerResult.codigo;
  const mio = turnos.find(t=>t.trabajador_codigo===yo);
  const hoy = todayStr();
  const miHtml = mio ? `
    <div class="mi-turno">
      <div class="lbl">Tu turno</div>
      <div class="hrs">${esc(horarioTxt(mio))}</div>
      <div class="dia-pills">${DIAS_CORTO.map((d,i)=>`<span class="dia-pill ${mio.dias.includes(i+1)?'on':''}">${d}</span>`).join('')}</div>
      ${mio.nota ? `<div class="small-note">${esc(mio.nota)}</div>` : ''}
    </div>` : `<div class="mi-turno"><div class="lbl">Tu turno</div><div class="small-note" style="margin-top:6px;">No tienes turno asignado esta semana.</div></div>`;
  const dias = DIAS_LARGO.map((nombre,i)=>{
    const fecha = sumarDias(lunes, i);
    const gente = turnos.filter(t=>t.dias.includes(i+1)).sort((a,b)=>(a.hora_inicio||'').localeCompare(b.hora_inicio||'') || a.nombre.localeCompare(b.nombre));
    return `
    <div class="day-card ${fecha===hoy?'hoy':''}">
      <div class="day-head"><span class="day-name">${nombre}${fecha===hoy?'<span class="tag-hoy">Hoy</span>':''}</span><span class="day-date">${fechaCorta(fecha)}</span></div>
      ${gente.length ? gente.map(t=>`<div class="shift-row ${t.trabajador_codigo===yo?'yo':''}"><span>${esc(t.nombre)}</span><span class="shift-hrs">${esc(horarioTxt(t))}</span></div>`).join('') : '<div class="small-note" style="margin:0;">Nadie programado.</div>'}
    </div>`;
  }).join('');
  return `
    <div class="seg">
      <button class="${turnoSemanaTrab===0?'active':''}" data-sem="0">Esta semana</button>
      <button class="${turnoSemanaTrab===1?'active':''}" data-sem="1">Próxima semana</button>
    </div>
    <div class="month-label" style="margin-bottom:14px;">${semanaLabel(lunes)}</div>
    ${turnos.length ? miHtml + dias : '<div class="empty-state">Los turnos de esta semana aún no están publicados.</div>'}`;
}

    {k:'lideres', l:'Líderes'}, {k:'qr', l:'Código QR'},
  ];
  const tabs = esAdmin ? tabsCompletas : [{k:'registrar', l:'Registrar'}];
  const tabsHtml = tabs.map(t=>`<div class="tab ${adminTab===t.k?'active':''}" data-tab="${t.k}">${t.l}</div>`).join('');
  const quienEres = `<div class="small-note" style="margin-bottom:14px;">Ingresaste como <strong>${currentSession.nombre}</strong>${esAdmin?'':' (acceso de líder)'}.</div>`;
  let body = '';
  if(!esAdmin){ adminTab = 'registrar'; }
  if(adminTab==='registrar') body = renderRegistrar();
  else if(adminTab==='trabajadores') body = renderTrabajadoresAdmin();
  else if(adminTab==='indicadores') body = renderIndicadoresAdmin();
  else if(adminTab==='resumen') body = renderResumen();
  else if(adminTab==='bonificacion') body = renderBonificacion();
  else if(adminTab==='lideres') body = renderLideresAdmin();
  else if(adminTab==='qr') body = renderQR();
  else if(adminTab==='turnos') body = renderTurnosAdmin();
  else if(adminTab==='cartelera') body = renderCarteleraAdmin();
  return `<div class="admin-wrap">${quienEres}<div class="tabs">${tabsHtml}</div>${body}</div>`;
}

function renderResumen(){
  const periodos = allPeriodos();
  if(!resumenPeriodo) resumenPeriodo = periodos[0];
  const opcionesPeriodo = periodos.map(p=>`<option value="${p}" ${p===resumenPeriodo?'selected':''}>${periodLabel(p)}</option>`).join('');
  const trabActivos = DATA.trabajadores.filter(t=>t.activo!==false);

  const porTrabajador = trabActivos.map(t=>{
    const cats = computeCategoryScores(t.codigo, resumenPeriodo);
    const overall = computeWeighted(cats);
    return {t, overall, cats};
  }).sort((a,b)=>(b.overall??0)-(a.overall??0));

  const promedioGeneral = porTrabajador.length
    ? Math.round((porTrabajador.reduce((a,r)=>a+(r.overall??0),0)/porTrabajador.length)*10)/10
    : null;
  const tierGeneral = tierOf(promedioGeneral);

  const cats = categoriesForPeriod(resumenPeriodo);
  const promedioPorCategoria = cats.map(ind=>{
    const valores = trabActivos.map(t=>{
      const c = computeCategoryScores(t.codigo, resumenPeriodo).find(x=>x.id===ind.id);
      return c ? c.score : 100;
    });
    const prom = valores.length ? Math.round((valores.reduce((a,v)=>a+v,0)/valores.length)*10)/10 : 100;
    return {nombre: ind.nombre, prom};
  });

  const filasTabla = porTrabajador.map(r=>{
    const tier = tierOf(r.overall);
    return `<tr>
      <td>${r.t.nombre}</td><td class="mono">${r.t.codigo}</td>
      <td style="width:120px;"><div class="mini-track"><div class="mini-fill" style="width:${r.overall??0}%;background:${tier.color};"></div></div></td>
      <td class="mono" style="font-weight:600;">${r.overall===null?'—':r.overall+'%'}</td>
      <td><span style="color:${tier.color};font-weight:600;">${tier.label}</span></td>
    </tr>`;
  }).join('');

  const detalleSel = resumenDetalleCodigo || (trabActivos[0] ? trabActivos[0].codigo : '');
  const detalleTrab = trabActivos.find(t=>t.codigo===detalleSel);
  const detalleCats = detalleTrab ? computeCategoryScores(detalleTrab.codigo, resumenPeriodo) : [];
  const detalleHistorial = detalleTrab ? historialDelPeriodo(detalleTrab.codigo, resumenPeriodo) : [];
  const opcionesDetalle = trabActivos.map(t=>`<option value="${t.codigo}" ${t.codigo===detalleSel?'selected':''}>${t.nombre}</option>`).join('');

  return `
  <div class="section-title">Resumen del periodo</div>
  <div class="card">
    <div class="field-group"><label>Periodo</label><select id="selPeriodo">${opcionesPeriodo}</select></div>

    <div class="mini-row">
      <div class="mini-head"><span class="nombre">Promedio general de la planta</span><span class="pct" style="color:${tierGeneral.color};">${promedioGeneral===null?'—':promedioGeneral+'%'}</span></div>
      <div class="mini-track" style="height:14px;"><div class="mini-fill" style="width:${promedioGeneral??0}%;background:${tierGeneral.color};"></div></div>
    </div>

    <div class="section-title" style="margin-top:20px;">Promedio por categoría (toda la planta)</div>
    ${promedioPorCategoria.map(c=>{
      const t = tierOf(c.prom);
      return `<div class="mini-row">
        <div class="mini-head"><span class="nombre">${c.nombre}</span><span class="pct">${c.prom}%</span></div>
        <div class="mini-track"><div class="mini-fill" style="width:${c.prom}%;background:${t.color};"></div></div>
      </div>`;
    }).join('') || '<div class="small-note">Sin indicadores configurados.</div>'}

    <div class="section-title" style="margin-top:24px;">Por trabajador</div>
    <table>
      <thead><tr><th>Nombre</th><th>Código</th><th></th><th>Score</th><th>Nivel</th></tr></thead>
      <tbody>${filasTabla || '<tr><td colspan="5" class="small-note">Sin trabajadores activos.</td></tr>'}</tbody>
    </table>
    <button class="secondary" style="margin-top:14px;" id="btnCopiarResumen">Copiar resumen para WhatsApp</button>

    <div class="section-title" style="margin-top:26px;">Detalle por categoría de un trabajador</div>
    <select id="selDetalle">${opcionesDetalle}</select>
    <div style="margin-top:14px;">
      ${detalleCats.map(c=>{
        const t = tierOf(c.score);
        const items = detalleHistorial.filter(h=>h.id===c.id);
        return `<div class="mini-row">
          <div class="mini-head"><span class="nombre">${c.nombre}${c.veces?` (${c.veces}×)`:''}</span><span class="pct">${c.score}%</span></div>
          <div class="mini-track"><div class="mini-fill" style="width:${c.score}%;background:${t.color};"></div></div>
          ${items.map(h=>`<div class="small-note" style="margin-top:4px;">${h.fecha} — ${h.nota||'sin observación'} <span style="color:var(--ink-soft);">(registró: ${h.registradoPor||'—'})</span></div>`).join('')}
        </div>`;
      }).join('') || '<div class="small-note">Sin trabajadores o indicadores aún.</div>'}
    </div>
  </div>`;
}

function formatCOP(v){
  return new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0}).format(v||0);
}
function renderBonificacion(){
  const quincenas = allQuincenas();
  if(!bonoQuincena) bonoQuincena = quincenas[0];
  const opcionesPeriodo = quincenas.map(q=>`<option value="${q}" ${q===bonoQuincena?'selected':''}>${quincenaLabel(q)}</option>`).join('');
  const {inicio, fin} = quincenaRange(bonoQuincena);
  const trabActivos = DATA.trabajadores.filter(t=>t.activo!==false);
  const filas = trabActivos.map(t=>{
    const overall = computeWeighted(computeCategoryScoresRange(t.codigo, inicio, fin));
    const pct = overall===null ? 0 : overall;
    const montoBase = Number(t.monto_base)||0;
    const valor = montoBase * (pct/100);
    return {codigo:t.codigo, nombre:t.nombre, pct, montoBase, valor};
  }).sort((a,b)=> b.pct-a.pct);
  const totalBono = filas.reduce((a,f)=>a+f.valor,0);

  return `
  <div class="section-title">Bonificación</div>
  <div class="card">
    <div class="field-group"><label>Quincena</label><select id="selPeriodoBono">${opcionesPeriodo}</select></div>
    <table>
      <thead><tr><th>Código</th><th>Nombre</th><th>%</th><th>Monto base</th><th>Bonificación</th></tr></thead>
      <tbody>${filas.map(f=>`<tr><td class="mono">${f.codigo}</td><td>${f.nombre}</td><td class="mono">${f.pct}%</td><td class="mono">${formatCOP(f.montoBase)}</td><td class="mono">${formatCOP(f.valor)}</td></tr>`).join('') || '<tr><td colspan="5" class="small-note">Sin trabajadores activos.</td></tr>'}</tbody>
      ${filas.length ? `<tfoot><tr><td colspan="4" style="font-weight:600;">Total a pagar</td><td class="mono" style="font-weight:600;">${formatCOP(totalBono)}</td></tr></tfoot>` : ''}
    </table>
    <button class="secondary" style="margin-top:14px;" id="btnGenerarPdfBono">Generar PDF / Imprimir</button>
    <div class="small-note">El monto base de cada quien se edita en la pestaña Trabajadores. El valor pagado es proporcional a su % de cumplimiento ponderado de esta quincena.</div>
  </div>`;
}

// Reduce la imagen en el celular/PC antes de subirla (máx. 1280 px, JPEG)
function comprimirImagen(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onerror = ()=>reject(new Error('No se pudo leer la imagen.'));
    r.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Formato de imagen no compatible.'));
      img.onload = ()=>{
        const max = 1280; let {width:w, height:h} = img;
        if(w>max || h>max){ const k = Math.min(max/w, max/h); w = Math.round(w*k); h = Math.round(h*k); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        let q = 0.8, out = c.toDataURL('image/jpeg', q);
        while(out.length > 1400000 && q > 0.4){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        resolve(out);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

let _xlsxPromise = null;
function cargarXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!_xlsxPromise) _xlsxPromise = new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=> res(window.XLSX);
    sc.onerror = ()=>{ _xlsxPromise = null; rej(new Error('No se pudo cargar el lector de Excel. Revisa la conexión.')); };
    document.head.appendChild(sc);
  });
  return _xlsxPromise;
}
function xlNorm(t){ return String(t==null?'':t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase(); }
function xlTexto(v){ return v==null ? '' : String(v).trim(); }
// Hora: acepta "06:00", "6:00", "6 am", "2:30 p. m.", "14", o número de Excel (fracción del día)
function xlHora(v){
  if(v===null || v===undefined || v==='') return {ok:true, val:''};
  if(typeof v==='number'){
    const frac = v % 1; const mins = Math.round(frac*1440) % 1440;
    if(v>=1 && Number.isInteger(v) && v<=24){ return {ok:true, val:String(v%24).padStart(2,'0')+':00'}; }
    return {ok:true, val:String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')};
  }
  const t = xlNorm(v).replace(/\./g,'').replace(/\s+/g,' ');
  const m = t.match(/^(\d{1,2})(?:[:h](\d{2}))?(?::\d{2})?\s*(am|pm|a m|p m)?$/);
  if(!m) return {ok:false};
  let h = parseInt(m[1],10); const mi = m[2] ? parseInt(m[2],10) : 0; const ap = m[3] ? m[3].replace(' ','') : '';
  if(mi>59) return {ok:false};
  if(ap){ if(h<1||h>12) return {ok:false}; if(ap==='pm' && h<12) h+=12; if(ap==='am' && h===12) h=0; }
  if(h>23) return {ok:false};
  return {ok:true, val:String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')};
}
function xlMarcado(v){ const t = xlNorm(v); return t!=='' && !['0','no','n','-','libre'].includes(t); }
function xlMonto(v){
  if(v===null || v===undefined || v==='') return {ok:true, val:null};
  if(typeof v==='number') return {ok:v>=0, val:Math.round(v)};
  const d = String(v).replace(/[^0-9]/g,''); if(!d) return {ok:false};
  return {ok:true, val:parseInt(d,10)};
}
// Busca el código tal cual; si Excel le quitó los ceros (7 en vez de 0007), lo empareja
function xlCodigo(v, existentes){
  const c = xlTexto(v); if(!c) return '';
  if(existentes.some(t=>t.codigo===c)) return c;
  if(/^\d+$/.test(c)){ const m = existentes.find(t=>/^\d+$/.test(t.codigo) && Number(t.codigo)===Number(c)); if(m) return m.codigo; }
  return c;
}
// Lee la primera hoja y devuelve las filas como objetos según la fila de encabezados
async function xlLeer(file, encabezadoClave){
  const XLSX = await cargarXLSX();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  const hi = aoa.findIndex(r=>r.some(c=>xlNorm(c)===encabezadoClave));
  if(hi<0) throw new Error('No encontré la columna "'+encabezadoClave+'". Usa la plantilla descargada.');
  const head = aoa[hi].map(xlNorm);
  const filas = aoa.slice(hi+1).map((r,i)=>({_fila: hi+2+i, ...Object.fromEntries(head.map((h,j)=>[h, r[j]]))}))
    .filter(o=>Object.entries(o).some(([k,v])=>k!=='_fila' && xlTexto(v)!==''));
  let meta = {};
  const info = wb.Sheets['Info'];
  if(info){ XLSX.utils.sheet_to_json(info,{header:1,raw:false,defval:''}).forEach(r=>{ if(r[0]) meta[xlNorm(r[0])] = r[1]; }); }
  return {filas, meta};
}
async function xlDescargar(nombre, encabezados, datos, anchos, info){
  const XLSX = await cargarXLSX();
  const ws = XLSX.utils.aoa_to_sheet([encabezados, ...datos]);
  ws['!cols'] = anchos.map(w=>({wch:w}));
  // Códigos y claves como texto (conserva ceros a la izquierda)
  Object.keys(ws).forEach(k=>{ if(k[0]!=='!' && ws[k].t==='s'){ ws[k].z='@'; } });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Datos');
  if(info){ const wi = XLSX.utils.aoa_to_sheet(info); wi['!cols']=[{wch:22},{wch:90}]; XLSX.utils.book_append_sheet(wb, wi, 'Info'); }
  XLSX.writeFile(wb, nombre);
}

async function analizarTrabajadores(file){
  const {filas} = await xlLeer(file, 'codigo');
  const existentes = DATA.trabajadores;
  const vistos = {}; let nuevos=0, actualizados=0, errores=0;
  const res = filas.map(f=>{
    const codigo = xlCodigo(f['codigo'], existentes);
    const nombre = xlTexto(f['nombre']);
    const clave = xlTexto(f['clave']);
    const m = xlMonto(f['monto base bono'] ?? f['monto base'] ?? f['monto']);
    const errs = [];
    if(!codigo) errs.push('Falta código');
    if(!nombre) errs.push('Falta nombre');
    if(!m.ok) errs.push('Monto no válido');
    const existe = existentes.find(t=>t.codigo===codigo);
    if(!existe && !clave) errs.push('Es nuevo y no tiene clave');
    if(codigo && vistos[codigo]) errs.push('Código repetido (fila '+vistos[codigo]+')');
    if(codigo) vistos[codigo] = vistos[codigo] || f._fila;
    const estado = errs.length ? 'error' : (existe ? 'actualizar' : 'nuevo');
    if(estado==='error') errores++; else if(estado==='nuevo') nuevos++; else actualizados++;
    return {fila:f._fila, codigo, nombre, clave, monto_base:m.val, estado, errs};
  });
  return {filas:res, nuevos, actualizados, errores};
}

async function analizarTurnos(file){
  const {filas, meta} = await xlLeer(file, 'codigo');
  const trab = DATA.trabajadores.filter(t=>t.activo!==false);
  const claves = ['l','m','x','j','v','s','d'];
  const vistos = {}; let validas=0, errores=0, libres=0;
  const res = filas.map(f=>{
    const codigo = xlCodigo(f['codigo'], trab);
    const t = trab.find(x=>x.codigo===codigo);
    const hi = xlHora(f['hora inicio']); const hf = xlHora(f['hora fin']);
    const dias = claves.map((k,i)=> xlMarcado(f[k]) ? i+1 : 0).filter(Boolean);
    const errs = [];
    if(!codigo) errs.push('Falta código');
    else if(!t) errs.push('Código no existe o está inactivo');
    if(!hi.ok) errs.push('Hora inicio no válida');
    if(!hf.ok) errs.push('Hora fin no válida');
    if(dias.length && hi.ok && hf.ok && (!hi.val || !hf.val)) errs.push('Falta hora (verá "por confirmar")');
    if(codigo && vistos[codigo]) errs.push('Persona repetida (fila '+vistos[codigo]+')');
    if(codigo) vistos[codigo] = vistos[codigo] || f._fila;
    const grave = errs.filter(e=>!e.startsWith('Falta hora')).length>0;
    if(grave) errores++; else if(dias.length) validas++; else libres++;
    return {fila:f._fila, codigo, nombre: t?t.nombre:xlTexto(f['nombre']), hora_inicio:hi.val||'', hora_fin:hf.val||'', dias, nota:xlTexto(f['nota']), grave, errs};
  });
  const semanaArchivo = meta['semana'] ? String(meta['semana']).slice(0,10) : null;
  const ausentes = trab.filter(t=>!res.some(r=>r.codigo===t.codigo)).length;
  return {filas:res, validas, errores, libres, ausentes, semanaArchivo};
}

        <h1 class="headline" style="font-size:17px;">Falta el archivo config.js</h1>
        <div class="small-note">Este indicador necesita el archivo <b>config.js</b> en la misma carpeta que index.html, con los datos de la empresa y de su proyecto Supabase.</div>
      </div></div>`;
    return;
  }
  aplicarMarca();
  registrarState.fecha = todayStr();
  if(SUPABASE_URL.indexOf('PEGA_AQUI')!==-1 || SUPABASE_ANON_KEY.indexOf('PEGA_AQUI')!==-1){
    document.getElementById('app').innerHTML = `
      <div class="wrap"><div class="card">
        <h1 class="headline" style="font-size:17px;">Falta conectar Supabase</h1>
        <div class="small-note">Abre <b>config.js</b> y reemplaza <b>supabaseUrl</b> y <b>supabaseAnonKey</b> con los datos de tu proyecto (Project Settings → API). Luego recarga la página.</div>
      </div></div>`;
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  render();
})();
</script>
</body>
